name: Bootstrap enrolled stations

# Trains stations that are registered but have no paired archive yet.
#
# Enrolling a large set happens in two steps on purpose. Registration writes
# stations.yaml in one commit; this workflow then backfills history and trains, sharded
# across runners. Doing both at once would have every parallel worker trying to commit
# the same registry file.
#
# It is safe to re-run: a station that already has an archive takes the incremental path
# instead of re-downloading years of history, so an interrupted bootstrap resumes rather
# than restarting.
#
# It deliberately does not verify. Walk-forward verification is the bulk of the
# per-station cost and the weekly retrain already does it; bootstrap's job is to fetch the
# history, which is the part that cannot be recomputed locally. Stations report themselves
# unmeasured until the retrain reaches them.

on:
  # Nightly, because enrollment and training are deliberately separate and nothing else
  # closes the gap between them. Registration is one commit; backfilling two years of
  # paired history for what it registered is hours of throttled network work, and until
  # this ran on a schedule it needed someone to press a button. A station enrolled on a
  # Friday then sat unpublished until somebody noticed.
  #
  # Each run takes a capped slice of the outstanding stations rather than the whole
  # backlog, so it finishes inside the job limit and the next night continues from where
  # it stopped. Which slice is not arbitrary: `--order prominence` spends the night's
  # budget on the stations serving the most people.
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of parallel workers'
        required: false
        default: '16'
      sources:
        description: 'Networks to bootstrap (e.g. MS). Blank means all.'
        required: false
        default: ''
      years:
        description: 'Years of history to backfill'
        required: false
        default: '2'
      limit:
        description: 'Max stations per worker (blank = no cap)'
        required: false
        default: ''
      all:
        description: 'Include stations that already have an archive'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards || '16' }}
        run: |
          python -c "
          import json, os
          n = int(os.environ['SHARDS'])
          print('matrix=' + json.dumps(list(range(n))))
          print('shards=' + str(n))
          " >> "$GITHUB_OUTPUT"

  bootstrap:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Bootstrapping is API-heavy and each worker paces itself independently, so
      # concurrency multiplies the effective request rate. Four workers at one request per
      # second stays well inside the quota; five was enough to start drawing 429s.
      max-parallel: 4
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e ".[train]"

      # Hugging Face allows 1000 API requests per 5 minutes, and twenty shards restoring
      # the whole archive at once blew through it — every worker then failed on its first
      # step. Scoping each restore to one shard's stations is most of the fix; this spreads
      # the remaining burst of metadata calls that a simultaneous fleet start produces.
      #
      # Measured rather than assumed: three back-to-back scoped restores, 2,142 files in
      # 78 seconds, drew no limit at all. So the quota tracks metadata calls, not file
      # volume, and a few minutes of spread is enough — an earlier version of this slept
      # four minutes per shard on the theory that every file cost a request, which the
      # measurement contradicts.
      - name: Stagger the restore
        run: sleep $(( ${{ matrix.shard }} * 45 ))

      - name: Restore state
        if: env.HF_TOKEN != ''
        run: python scripts/sync_state.py download --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.shards }}

      # The scheduled run works the backlog: stations with no paired archive yet, most-
      # read first, capped so the job ends before the runner kills it. A manual run can
      # still ask for everything with `all: true`.
      #
      # The cap is per worker and deliberately conservative. Bootstrapping is the
      # expensive path — two years of archived model output per station, fetched ten
      # locations at a time against an API that throttles — so the useful question is not
      # how many stations exist but how many can be banked before the 350-minute limit.
      # Sixteen workers at 60 stations is roughly a thousand a night; the backlog drains
      # in days rather than in one heroic run that times out and saves nothing.
      - name: Bootstrap shard
        env:
          SOURCES: ${{ inputs.sources }}
          LIMIT: ${{ inputs.limit || (github.event_name == 'schedule' && '60' || '') }}
          ALL: ${{ inputs.all }}
        run: |
          # Decided in the shell rather than in an expression: `cond && '' || flag` reads
          # like a ternary and is not one — an empty string is falsy, so that form always
          # yields the fallback and the flag could never be turned off.
          UNTRAINED=--only-untrained
          if [ "$ALL" = "true" ]; then UNTRAINED=""; fi

          wxfuser refresh --bootstrap \
            --years ${{ inputs.years || '2' }} \
            --checkpoint-every 15 \
            --order prominence \
            --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.shards }} \
            ${UNTRAINED} \
            ${LIMIT:+--limit "$LIMIT"} \
            ${SOURCES:+--sources "$SOURCES"}

      - name: Save state
        if: always() && env.HF_TOKEN != ''
        run: |
          for i in 1 2 3; do
            python scripts/sync_state.py upload --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.shards }} && break
            echo "state upload attempt $i failed; retrying"
            sleep $((i * 20))
          done

  publish:
    needs: bootstrap
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish the newly trained stations
        run: gh workflow run refresh.yml || true
