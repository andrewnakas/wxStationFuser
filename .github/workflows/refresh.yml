name: Refresh forecasts

# The forecast cadence. Pulls the latest observations and model runs for every enrolled
# station, refits the cheap tiers on data up to the current hour, and republishes the
# site. The champion method and its verification come from the weekly retrain, so this
# job stays fast enough to run several times a day.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'stations.yaml'
      - 'src/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Promoted to a job-level variable so steps can test whether it is configured.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e ".[train]"

      # State is the paired archives and fitted champions. Two stores, in order of
      # preference: a Hugging Face dataset when HF_TOKEN is configured (durable, shared
      # across workflows), otherwise the Actions cache, which needs no secrets at all and
      # stays warm because this job runs every few hours. Missing state is never fatal —
      # a station rebuilds its history from the upstream APIs, which is slower but
      # correct. The cache is saved automatically when the job ends.
      - name: Restore state (Actions cache)
        uses: actions/cache@v4
        with:
          path: state
          key: wxfuser-state-${{ github.run_id }}
          restore-keys: |
            wxfuser-state-

      - name: Restore state (Hugging Face)
        if: env.HF_TOKEN != ''
        run: python scripts/sync_state.py download || echo "no hub state yet; using cache"

      - name: Refresh all stations
        run: wxfuser refresh

      - name: Save state (Hugging Face)
        if: always() && env.HF_TOKEN != ''
        run: python scripts/sync_state.py upload || echo "state upload skipped"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15
