name: Refresh forecasts

# The forecast cadence, fanned out across workers.
#
# One runner cannot refresh a thousand stations inside the job limit, so the registry is
# split round-robin and each shard handles its slice. Shards cannot each deploy Pages —
# the deploy publishes a whole directory, so the last one to finish would replace the
# site with only its own stations. Instead each shard uploads its output as an artifact
# and a single publish job merges them and deploys once.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      # Kept modest deliberately, though the evidence for the exact number is weaker than
      # it first looked. What is established: a twelve-shard run over 4,760 stations spent
      # 5.7 hours and banked nothing, and sustained refreshing exhausts Open-Meteo's free
      # tier — a single shard running alone afterwards was still throttled 26 times.
      #
      # What is NOT established is that the shard count caused it. Runners are separate
      # machines, so they may not share a rate-limit budget the way concurrent processes on
      # one host do; the un-chunked fetch (see --checkpoint-every below) and simple quota
      # exhaustion explain the observation without invoking shard concurrency at all.
      # Six is a cautious default, not a measured optimum.
      shards:
        description: 'Number of parallel workers'
        required: false
        default: '6'
      sources:
        description: 'Networks to refresh (e.g. ASOS,SNOTEL). Blank means all.'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'stations.yaml'
      - 'src/**'

permissions:
  contents: read
  pages: write
  id-token: write

# Queue, do not cancel. A refresh is hours of network-bound work, and cancel-in-progress
# meant any push touching src/ — or simply the next scheduled run coming round — killed a
# fleet mid-flight and threw away everything it had downloaded. That happened repeatedly:
# one cron tick landed on a twelve-shard run whose workers were nine steps in.
#
# The setting exists to stop stale deploys racing each other to Pages. Letting runs queue
# achieves that too, and the last to finish is still the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards || '6' }}
        run: |
          python -c "
          import json, os
          n = int(os.environ['SHARDS'])
          print('matrix=' + json.dumps(list(range(n))))
          print('shards=' + str(n))
          " >> "$GITHUB_OUTPUT"

  refresh:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e ".[train]"

      # Hugging Face allows 1000 API requests per 5 minutes, and twenty shards restoring
      # the whole archive at once blew through it — every worker then failed on its first
      # step. Scoping each restore to one shard's stations is most of the fix; this spreads
      # the remaining burst of metadata calls that a simultaneous fleet start produces.
      #
      # Measured rather than assumed: three back-to-back scoped restores, 2,142 files in
      # 78 seconds, drew no limit at all. So the quota tracks metadata calls, not file
      # volume, and a few minutes of spread is enough — an earlier version of this slept
      # four minutes per shard on the theory that every file cost a request, which the
      # measurement contradicts.
      - name: Stagger the restore
        run: sleep $(( ${{ matrix.shard }} * 45 ))

      - name: Restore state
        if: env.HF_TOKEN != ''
        run: python scripts/sync_state.py download --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.shards }}

      # Checkpointed because a timeout kills the job outright and its final upload never
      # runs. A shard covering hundreds of stations is hours of network-bound work, and
      # without this the whole lot dies with the runner — bootstrap has always checkpointed
      # for exactly this reason, and refresh grew long enough to need it too.
      - name: Refresh shard
        env:
          SOURCES: ${{ inputs.sources }}
        run: |
          wxfuser refresh --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.shards }} \
            --checkpoint-every 100 \
            ${SOURCES:+--sources "$SOURCES"}

      # Each shard writes only its own stations, so uploading in parallel touches
      # disjoint paths. Conflicts are still possible on the underlying ref, hence retries.
      - name: Save state
        if: always() && env.HF_TOKEN != ''
        run: |
          for i in 1 2 3; do
            python scripts/sync_state.py upload --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.shards }} && break
            echo "state upload attempt $i failed; retrying"
            sleep $((i * 20))
          done

      - uses: actions/upload-artifact@v4
        with:
          name: site-shard-${{ matrix.shard }}
          path: |
            site/stations/
            site/index-shard-*.json
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: [plan, refresh]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      # Needs [train] despite doing no training: sync_state imports huggingface_hub, which
      # the base install does not carry. With a bare install the hub restore below failed
      # on every deploy — tolerated by `|| echo`, so silently — which is why the published
      # catalogue went missing and why the merged index had no baseline to build on.
      - name: Install
        run: pip install -e ".[train]"

      - name: Collect shard output
        uses: actions/download-artifact@v4
        with:
          pattern: site-shard-*
          path: site
          merge-multiple: true

      - name: Restore catalogue and merge the index
        run: |
          python scripts/sync_state.py download --paths catalogue,site || echo "no hub state; catalogue may be absent"
          wxfuser merge-index
          rm -f site/index-shard-*.json
          du -sh site || true

      # The merged index is the only record of stations this run did not touch. The site
      # is rebuilt from a fresh checkout every deploy, so without this the next partial
      # run would have no baseline to add to.
      - name: Persist the merged index
        run: python scripts/sync_state.py upload --paths site || echo "index baseline not saved"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15
