name: Refresh forecasts

# The forecast cadence. Pulls the latest observations and model runs for every enrolled
# station, refits the cheap tiers on data up to the current hour, and republishes the
# site. The champion method and its verification come from the weekly retrain, so this
# job stays fast enough to run several times a day.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'stations.yaml'
      - 'src/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e ".[train]"

      - name: Restore state from Hugging Face
        # State is the paired archives and fitted champions. Missing state is not fatal:
        # a station simply rebuilds its history, so a first run or a hub outage degrades
        # to a slower job rather than a failed one.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_state.py download || echo "no state yet; starting cold"

      - name: Refresh all stations
        env:
          SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
        run: wxfuser refresh

      - name: Save state to Hugging Face
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_state.py upload || echo "state upload skipped"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15
