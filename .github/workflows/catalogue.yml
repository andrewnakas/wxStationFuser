name: Rebuild station catalogue

# The list of stations a user can search and enroll. Rebuilt weekly because networks add
# and retire stations continuously; the file is a static asset the site loads lazily.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated sources (nws,iem,meteostat)'
        required: false
        default: 'nws,iem,meteostat'

permissions:
  contents: read
  actions: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e ".[train]"

      - name: Restore state (Actions cache)
        uses: actions/cache@v4
        with:
          path: state
          key: wxfuser-state-${{ github.run_id }}
          restore-keys: |
            wxfuser-state-

      - name: Build catalogue
        run: wxfuser catalogue --sources "${{ inputs.sources || 'nws,iem,meteostat' }}"

      - name: Publish to Hugging Face
        if: env.HF_TOKEN != ''
        run: python scripts/sync_state.py upload --paths catalogue

      - name: Trigger a refresh so the site picks up the new catalogue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run refresh.yml || true
