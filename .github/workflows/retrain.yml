name: Weekly retrain

# Re-runs the walk-forward verification for every station and re-decides which method to
# publish. This is the expensive job — dozens of refits per variable — which is exactly
# why it is separate from the forecast cadence. The numbers it produces are what the site
# quotes as its skill claim, so it must never be skipped to save time.

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      station:
        description: 'Limit to one station id (blank = all)'
        required: false
      shards:
        description: 'Number of parallel workers'
        required: false
        default: '10'

permissions:
  contents: read
  actions: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards || '10' }}
        run: |
          python -c "
          import json, os
          n = int(os.environ['SHARDS'])
          print('matrix=' + json.dumps(list(range(n))))
          print('shards=' + str(n))
          " >> "$GITHUB_OUTPUT"

  retrain:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e ".[train]"

      - name: Restore state (Actions cache)
        uses: actions/cache@v4
        with:
          path: state
          key: wxfuser-state-${{ github.run_id }}
          restore-keys: |
            wxfuser-state-

      # Hugging Face allows 1000 API requests per 5 minutes, and twenty shards restoring
      # the whole archive at once blew through it — every worker then failed on its first
      # step. Scoping each restore to one shard's stations is most of the fix; this spreads
      # the remaining burst of metadata calls that a simultaneous fleet start produces.
      #
      # Measured rather than assumed: three back-to-back scoped restores, 2,142 files in
      # 78 seconds, drew no limit at all. So the quota tracks metadata calls, not file
      # volume, and a few minutes of spread is enough — an earlier version of this slept
      # four minutes per shard on the theory that every file cost a request, which the
      # measurement contradicts.
      - name: Stagger the restore
        run: sleep $(( ${{ matrix.shard }} * 45 ))

      - name: Restore state (Hugging Face)
        if: env.HF_TOKEN != ''
        run: python scripts/sync_state.py download --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.shards }}

      - name: Retrain and re-verify
        run: |
          if [ -n "${{ inputs.station }}" ]; then
            wxfuser retrain --station "${{ inputs.station }}"
          else
            wxfuser retrain --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.shards }}
          fi

      - name: Save state (Hugging Face)
        if: always() && env.HF_TOKEN != ''
        run: python scripts/sync_state.py upload --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.shards }}

  publish:
    needs: retrain
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Republish so the site shows the re-chosen methods
        run: gh workflow run refresh.yml || true
