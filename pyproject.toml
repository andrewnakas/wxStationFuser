[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wxfuser"
version = "0.1.0"
description = "Station-fused probabilistic weather forecasts: calibrate any NWP model against any surface station"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
train = ["lightgbm>=4.1", "scikit-learn>=1.3", "huggingface-hub>=0.23"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
wxfuser = "wxfuser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
