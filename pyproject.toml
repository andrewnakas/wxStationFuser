[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wxfuser"
version = "0.1.0"
description = "Station-fused probabilistic weather forecasts: calibrate any NWP model against any surface station"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
# Reading dynamical.org's Zarr archives. Separated because it is the one part of the
# system with a hard floor on the interpreter: icechunk 2 is the first version that can
# read the repositories dynamical publishes, and it requires Python 3.12. That floor is
# why `requires-python` moved — a 3.11 environment resolves icechunk back to 1.1.21,
# which opens the store, reads the metadata, and then fails on every chunk.
grid = [
    "icechunk>=2.0",
    "zarr>=3.1",
    "pystac>=1.10",
]
train = [
    "lightgbm>=4.1",
    "scikit-learn>=1.3",
    "huggingface-hub>=0.23",
    # Reads the remote ASOS parquet archive. Easy to miss because a developer who has
    # installed it by hand sees everything work, while a fresh environment silently
    # fails every airport station and succeeds at the other networks.
    "duckdb>=1.0",
    "wxfuser[grid]",
]
# Ruff is pinned to a minor series: its import-sorting rules change between releases,
# and an unpinned range meant CI could fail a lint that passed locally on the same commit.
#
# dev pulls in train deliberately. Without it CI installed neither huggingface_hub nor
# duckdb, so every test touching the hub or the ASOS archive was skipped there while
# passing on a developer machine that happened to have them — and the sync bug that killed
# every data job for days lived in exactly that blind spot. A slower install is worth
# testing the code paths production actually runs.
dev = ["pytest>=7.4", "ruff~=0.16.3", "wxfuser[train]"]

[project.scripts]
wxfuser = "wxfuser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Without these, ruff infers whether `wxfuser` is first-party from what happens to be
# importable, which differs between a local editable install and a fresh CI environment —
# so import sorting passed locally and failed in CI on the identical commit.
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["wxfuser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
