[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wxfuser"
version = "0.1.0"
description = "Station-fused probabilistic weather forecasts: calibrate any NWP model against any surface station"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
train = [
    "lightgbm>=4.1",
    "scikit-learn>=1.3",
    "huggingface-hub>=0.23",
    # Reads the remote ASOS parquet archive. Easy to miss because a developer who has
    # installed it by hand sees everything work, while a fresh environment silently
    # fails every airport station and succeeds at the other networks.
    "duckdb>=1.0",
]
# Ruff is pinned to a minor series: its import-sorting rules change between releases,
# and an unpinned range meant CI could fail a lint that passed locally on the same commit.
dev = ["pytest>=7.4", "ruff~=0.16.3"]

[project.scripts]
wxfuser = "wxfuser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Without these, ruff infers whether `wxfuser` is first-party from what happens to be
# importable, which differs between a local editable install and a fresh CI environment —
# so import sorting passed locally and failed in CI on the identical commit.
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["wxfuser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
